<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>
    <!-- GET -->
    <div id='div_get' class='div_principal'>
        <h1>GET</h1>
        <form action="">
            <button type="button" onclick="window.location.href='/pessoa'" class="b-page">Pessoa</button>
            <button type="button" onclick="window.location.href='/usuario'" class="b-page">Usuário</button>

            <label for="">Digite o ID de uma pessoa para procura-lá</label>
            <div class='div_get'>
                <input type="search" placeholder="ID Pessoa" class="input_get" id="buscarPessoaPorId">
                <button class="button_get" type="button" id="buscarPessoaPorIdBotao">Procurar</button>
            </div>
            
            <label for="">Digite o ID de um usuário para procura-lá</label>
            <div class='div_get'>
                <input type="search" placeholder="ID Usuario" class="input_get" id = "buscarUsuarioPorId">
                <button class="button_get" type="button" id="buscarUsuarioPorIdBotao">Procurar</button>
            </div>
        </form>
    </div>

    <!-- PUT -->
    <div id='div_put' class='div_principal'>
        <h1>PUT</h1>
        <form action="">
            <label for="">Digite o ID da pessoa ou usuário para atualizar:</label>
            <div class='div_get'>
                <input type="search" placeholder="ID Pessoa" class="input_get" id = 'IdPessoaAtualizar'>
                <input type="search" placeholder="Nome Pessoa" class="input_get" id = 'NomePessoaAtualizar'>
                <button class="button_get" type="button" id = 'BotaoPessoaAtualizar'>Atualizar</button>
            </div>
            <div class='div_get'>
                <input type="search" placeholder="ID Usuário" class="input_get" id = 'IdUsuarioAtualizar'>
                <input type="search" placeholder="Nome Usuário" class="input_get" id = 'NomeUsuarioAtualizar'>
                <input type="search" placeholder="Email Usuário" class="input_get" id = 'EmailUsuarioAtualizar'>
                <button class="button_get" type="button" id = 'BotaoUsuarioAtualizar'>Atualizar</button>
            </div>
        </form>
    </div>

    <!-- POST -->
    <div id='div_post' class='div_principal'>
        <h1>POST</h1>
        <form action="">
            <label for="">Digite os dados para criar uma nova pessoa:</label>
            <div class='div_get'>
                <input type="text" placeholder="Nome da Pessoa" class="input_get" id="AdicionarPessoa">
                <button class="button_get" type="button" id ='AdicionarPessoaBotao'>Criar Pessoa</button>
            </div>
            
            <label for="">Digite os dados para criar um novo usuário:</label>
            <div class='div_get'>
                <input type="text" placeholder="Nome do Usuário" class="input_get" id="AdicionarNomeUsuario">
                <input type="email" placeholder="Email do Usuário" class="input_get" id = 'AdicionarEmailUsuario'>
                <button class="button_get" type="button" id ='AdicionarUsuarioBotao'>Criar Usuário</button>
            </div>
        </form>
    </div>

    <!-- DELETE -->
    <div id='div_delete' class='div_principal'>
        <h1>DELETE</h1>
        <form action="">
            <label for="">Digite o ID da pessoa ou usuário para excluir:</label>
            <div class='div_get'>
                <input type="search" placeholder="ID Pessoa" class="input_get" id = 'IdPessoaDelete'>
                <button class="button_get" type="button" id = 'BotaoPessoaDelete'>Excluir</button>
            </div>
            <div class='div_get'>
                <input type="search" placeholder="ID Usuário" class="input_get" id = 'IdUsuarioDelete'>
                <button class="button_get" type="button" id = 'BotaoUsuarioDelete' >Excluir</button>
            </div>
        </form>
    </div>
</body>
</html>
